<script>

let game;
let board;
let score = 0;
let time = 30;
let timer;
let currentPuzzle = null;

// ---------------- LOAD RANDOM LICHESS PUZZLE ----------------
async function loadPuzzle() {

    try {
        const res = await fetch("https://lichess.org/api/puzzle/daily");
        const data = await res.json();

        // fallback safety
        if (!data.game || !data.puzzle) {
            console.log("Invalid puzzle, retrying...");
            loadPuzzle();
            return;
        }

        currentPuzzle = data.puzzle;

        game = new Chess(data.game.fen);

        board = Chessboard('board', {
            draggable: true,
            position: game.fen(),
            pieceTheme: "https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png",
            onDrop: onDrop
        });

        startTimer();
        document.getElementById("message").innerHTML = "";

    } catch (e) {
        console.log("Error loading puzzle:", e);
    }
}

// ---------------- MOVE ----------------
function onDrop(source, target) {

    let move = game.move({
        from: source,
        to: target,
        promotion: 'q'
    });

    if (move === null) return 'snapback';

    board.position(game.fen());
}

// ---------------- CHECK ----------------
function checkAnswer() {

    if (!currentPuzzle) return;

    if (game.in_checkmate()) {

        clearInterval(timer);
        score++;

        document.getElementById("score").innerHTML = "Score: " + score;
        document.getElementById("message").innerHTML = "✅ Correct Checkmate!";
    } else {
        document.getElementById("message").innerHTML = "❌ Not correct yet!";
    }
}

// ---------------- NEXT ----------------
function nextPuzzle() {
    clearInterval(timer);
    loadPuzzle();
}

// ---------------- TIMER ----------------
function startTimer() {

    clearInterval(timer);
    time = 30;

    document.getElementById("timer").innerHTML = "Time Left: 30";

    timer = setInterval(() => {

        time--;
        document.getElementById("timer").innerHTML = "Time Left: " + time;

        if (time <= 0) {
            clearInterval(timer);
            document.getElementById("message").innerHTML = "⏰ Time Up!";
        }

    }, 1000);
}

// ---------------- START ----------------
window.onload = loadPuzzle;

</script>
