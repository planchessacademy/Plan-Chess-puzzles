<script>

let game;
let board;
let score = 0;
let timer;
let time = 30;
let currentPuzzle = null;

// ---------------- LOAD RANDOM PUZZLE (MANY PUZZLES) ----------------
async function loadPuzzle() {

    try {
        // random puzzle from Lichess API (lots of puzzles)
        const res = await fetch("https://lichess.org/api/puzzle/themes/mateIn1");
        const data = await res.json();

        // pick random puzzle
        const puzzles = data.puzzles || [];
        if (puzzles.length === 0) {
            console.log("No puzzles found, retrying...");
            loadPuzzle();
            return;
        }

        const random = puzzles[Math.floor(Math.random() * puzzles.length)];
        currentPuzzle = random;

        game = new Chess(random.fen);

        if (board) board.destroy();

        board = Chessboard('board', {
            draggable: true,
            position: game.fen(),
            pieceTheme: "https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png",
            onDrop: onDrop
        });

        startTimer();
        document.getElementById("message").innerHTML = "";

    } catch (e) {
        console.log("Error loading puzzles:", e);
    }
}

// ---------------- MOVE ----------------
function onDrop(source, target) {

    let move = game.move({
        from: source,
        to: target,
        promotion: 'q'
    });

    if (move === null) return 'snapback';

    board.position(game.fen());
}

// ---------------- CHECK ANSWER ----------------
function checkAnswer() {

    if (game.in_checkmate()) {

        clearInterval(timer);
        score++;

        document.getElementById("score").innerHTML = "Score: " + score;
        document.getElementById("message").innerHTML = "✅ Correct Checkmate!";
    } else {
        document.getElementById("message").innerHTML = "❌ Not correct yet!";
    }
}

// ---------------- NEXT PUZZLE ----------------
function nextPuzzle() {
    clearInterval(timer);
    loadPuzzle();
}

// ---------------- TIMER ----------------
function startTimer() {

    clearInterval(timer);
    time = 30;

    document.getElementById("timer").innerHTML = "Time Left: 30";

    timer = setInterval(() => {

        time--;
        document.getElementById("timer").innerHTML = "Time Left: " + time;

        if (time <= 0) {
            clearInterval(timer);
            document.getElementById("message").innerHTML = "⏰ Time Up!";
        }

    }, 1000);
}

// ---------------- START ----------------
window.onload = loadPuzzle;

</script>
