<!DOCTYPE html>
<html>
<head>
<title>Plan Chess Academy</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<style>
body{
font-family:Arial;
text-align:center;
padding:20px;
}

#board{
width:400px;
margin:auto;
}

button{
padding:10px 20px;
margin:10px;
font-size:16px;
}

#timer{
font-size:22px;
color:red;
}

#score{
font-size:20px;
}

#message{
font-size:20px;
font-weight:bold;
margin-top:10px;
}
</style>

</head>

<body>

<h1>♟️ Plan Chess Academy</h1>
<h2>Mate in 1 Trainer</h2>

<div id="timer">Time Left: 30</div>
<div id="score">Score: 0</div>

<div id="board"></div>

<button onclick="checkAnswer()">Check Answer</button>
<button onclick="nextPuzzle()">Next Puzzle</button>

<div id="message"></div>

<script>
const puzzles = [
{
fen:"8/8/8/8/8/5K2/6R1/6k1 w - - 0 1"
}
];

let current = 0;
let score = 0;
let time = 30;
let timer;
let game;
let board;

function loadPuzzle() {

game = new Chess(puzzles[current].fen);

if(board){
board.destroy();
}

board = Chessboard('board',{
draggable:true,
position:game.fen(),
pieceTheme:"https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png",
onDrop:onDrop
});

document.getElementById("message").innerHTML="";
startTimer();
}

function onDrop(source,target){

let move = game.move({
from:source,
to:target,
promotion:'q'
});

if(move===null){
return 'snapback';
}

board.position(game.fen());
}
    function checkAnswer(){

if(game.in_checkmate()){

clearInterval(timer);

score++;

document.getElementById("score").innerHTML =
"Score: " + score;

document.getElementById("message").innerHTML =
"✅ Correct Checkmate!";

}else{

document.getElementById("message").innerHTML =
"❌ Not Checkmate!";
}

}

function nextPuzzle(){

clearInterval(timer);

current++;

if(current >= puzzles.length){

alert("All puzzles completed!");

current = 0;
score = 0;

document.getElementById("score").innerHTML =
"Score: 0";
}

loadPuzzle();
}

function startTimer(){

clearInterval(timer);

time = 30;

document.getElementById("timer").innerHTML =
"Time Left: 30";

timer = setInterval(function(){

time--;

document.getElementById("timer").innerHTML =
"Time Left: " + time;

if(time <= 0){

clearInterval(timer);

document.getElementById("message").innerHTML =
"⏰ Time Up!";
}

},1000);
}

window.onload = loadPuzzle;

</script>

</body>
</html>
